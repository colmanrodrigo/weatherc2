<!doctype html>

  <head>
    <meta charset="utf-8" />

    <title></title>
    <style>
      /* Página limpia sin texto ni márgenes */
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: #ffffff;
      }

      /* Contenedor en la esquina superior izquierda, escalado 3x */
      .widget-left {
        transform-origin: left top;
        transform: scale(3);              /* <-- escala 3x */
        width: calc(100% / 3);            /* base width = visibleWidth / scale */
        height: auto;
        margin: 0;
        padding: 0;
        display: block;
      }

      /* Evita que el body muestre texto accidentalmente */
      body * {
        font-size: 0;
        line-height: 0;
      }

      /* Permite que el widget conserve su propio texto/estilos internos */
      .widget-left, .widget-left * {
        font-size: initial;
        line-height: initial;
      }
    </style>
  </head>
